[project]
name = "fogofwar"
version = "0.1.0"
description = "Verifiable abstention and look-ahead-bias-free memory for conversational agents, built on HydraDB."
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "neo4j>=5.24",
    # Rust packstream codec: the driver's pure-Python packer proved unstable
    # under this project's large batched-write payloads (see client.py).
    "neo4j-rust-ext>=5.24",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
